[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=frogplug:frogplug

; Без этой секции supervisorctl не может управлять процессами, и агент не перезапустит службы.
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=10
autorestart=true
startretries=3

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=20
autorestart=true
startretries=3

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
user=frogplug
environment=HOME="/var/lib/frogplug",XRAY_LOCATION_ASSET="/etc/xray"
priority=30
autorestart=true
startretries=3

[program:mtg]
command=/usr/local/bin/mtg run /etc/mtg.toml
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=35
autostart=false
autorestart=true
startretries=3

[program:tgweb]
command=/usr/local/bin/tproxy-server -config /etc/tproxy-server/config.json -profiles-file /etc/tproxy-server/profiles.json
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=36
autostart=false
autorestart=true
startretries=3

[program:mtproxy]
command=/etc/mtproxy/start.sh
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=36
autostart=false
autorestart=true
startretries=3

[program:hysteria]
command=/usr/local/bin/hysteria server -c /etc/hysteria/config.yaml
user=frogplug
environment=HOME="/var/lib/frogplug"
priority=37
autostart=false
autorestart=true
startretries=3

[program:frogplug-agent]
command=/usr/local/bin/frogplug-agent
user=frogplug
environment=HOME="/var/lib/frogplug",XRAY_LOCATION_ASSET="/etc/xray"
priority=40
autorestart=true
startretries=3

[include]
files = /etc/supervisor/conf.d/*.conf
